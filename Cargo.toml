[workspace]
members = ["crates/vibe-string", "crates/vibe-string-core", "tools"]
default-members = ["crates/vibe-string"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["2d", "audio", "wav"] }
vibe-string-core = { path = "crates/vibe-string-core" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
